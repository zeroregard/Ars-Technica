name: Process Curseforge Comments

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  process-comments:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: |
          cd .github/scripts
          npm ci
          # Only install openai if the API key is provided
          if [ -n "$OPENAI_API_KEY" ]; then
            npm install openai
          fi

      - name: Build TypeScript
        run: |
          cd .github/scripts
          npm run build

      - name: Run tests
        run: |
          cd .github/scripts
          npm test

      - name: Process Curseforge comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This is optional - will use keyword detection if not provided
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd .github/scripts
          node dist/process_comments.js 