name: Process Curseforge Comments

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual triggering

env:
  DEBUG: 'true'  # Enable debug logging

jobs:
  process-comments:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm install

      - name: Build TypeScript
        run: |
          cd .github/scripts
          npm run build

      - name: Run comment processor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEBUG: 'true'  # Enable debug logs
          FORCE_COLOR: '1'  # Enable colored output
        run: |
          cd .github/scripts
          node --unhandled-rejections=strict dist/index.js

      - name: Summary
        if: always()
        run: |
          echo "## CurseForge Comment Processor Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details on processed comments and any issues created." >> $GITHUB_STEP_SUMMARY 