name: Process Curseforge Comments

on:
  workflow_dispatch:  # Allow manual triggering

env:
  DEBUG: 'true'  # Enable debug logging

jobs:
  process-comments:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Install puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Install dependencies
        run: |
          cd .github/scripts
          npm ci

      - name: Build TypeScript files
        run: |
          cd .github/scripts
          npm run build

      - name: Run comments processor
        run: |
          cd .github/scripts
          node --unhandled-rejections=strict dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: .github/scripts/debug/
          retention-days: 5

      - name: Summary
        if: always()
        run: |
          echo "## CurseForge Comment Processor Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details on processed comments and any issues created." >> $GITHUB_STEP_SUMMARY 